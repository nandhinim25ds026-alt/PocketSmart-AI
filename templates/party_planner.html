<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Party Planner - PocketSmart</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="navbar">
    <div class="brand">PocketSmart</div>
    <div>
      <a href="/dashboard">Dashboard</a>
      <a href="/home-planner">Home Planner</a>
      <a href="/jewelry-planner">Jewelry Planner</a>
      <a href="/history">History</a>
    </div>
  </div>

  <div class="container">
    <div class="card">
      <h2>Party Budget Planner</h2>
      <form id="partyForm">
        <label>Total Budget (₹)</label>
        <input type="number" name="total_budget" min="0" step="0.01" required>

        <label>Number of Guests</label>
        <input type="number" name="num_guests" min="1" required>

        <label>Party Type</label>
        <input type="text" name="party_type" placeholder="Birthday, Wedding, Corporate..." required>

        <label>Venue Type</label>
        <input type="text" name="venue_type" placeholder="Home, Banquet Hall, Outdoor...">

        <div class="checkbox-row"><input type="checkbox" name="needs_catering" id="ct" checked><label for="ct" style="display:inline;">Catering</label></div>
        <div class="checkbox-row"><input type="checkbox" name="needs_decoration" id="dc" checked><label for="dc" style="display:inline;">Decoration</label></div>
        <div class="checkbox-row"><input type="checkbox" name="needs_entertainment" id="en" checked><label for="en" style="display:inline;">Entertainment</label></div>

        <label>Additional Requirements</label>
        <textarea name="additional_requirements" rows="3" placeholder="Themes, dietary restrictions, etc."></textarea>

        <button type="submit" class="btn" style="margin-top:20px;">Generate Budget Plan</button>
      </form>
      <div id="loading" style="display:none;">Generating your party plan...</div>
      <div id="errorBox"></div>
    </div>

    <div id="results"></div>
  </div>

  <script>
    const form = document.getElementById("partyForm");
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      document.getElementById("loading").style.display = "block";
      document.getElementById("errorBox").innerHTML = "";
      document.getElementById("results").innerHTML = "";

      const fd = new FormData(form);
      const payload = {
        total_budget: parseFloat(fd.get("total_budget")),
        num_guests: parseInt(fd.get("num_guests")),
        party_type: fd.get("party_type"),
        venue_type: fd.get("venue_type") || null,
        needs_catering: fd.get("needs_catering") === "on",
        needs_decoration: fd.get("needs_decoration") === "on",
        needs_entertainment: fd.get("needs_entertainment") === "on",
        additional_requirements: fd.get("additional_requirements") || null
      };

      try {
        const res = await fetch("/party-budget", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error((await res.json()).detail || "Request failed");
        const result = await res.json();
        renderResults(result);
      } catch (err) {
        document.getElementById("errorBox").innerHTML = `<div class="error-box">${err.message}</div>`;
      } finally {
        document.getElementById("loading").style.display = "none";
      }
    });

    function renderResults(result) {
      let html = `<div class="budget-summary">
        <div>Total Budget: ₹${result.total_budget}</div>
        <div>Remaining: ₹${result.remaining_budget}</div>
      </div>`;

      (result.budget_breakdown || []).forEach(cat => {
        html += `<div class="card result-category">
          <h3>${cat.category} — Allocation ₹${cat.allocation}</h3>`;
        (cat.items || []).forEach(item => {
          html += `<div class="result-item">
            <strong>${item.name}</strong> (x${item.quantity}) — ₹${item.estimated_price}
            <p>${item.description}</p>
            <div class="shopping-links">`;
          if (item.shopping_links) {
            for (const [site, url] of Object.entries(item.shopping_links)) {
              html += `<a href="${url}" target="_blank">${site}</a>`;
            }
          }
          html += `</div></div>`;
        });
        html += `</div>`;
      });

      if (result.additional_suggestions && result.additional_suggestions.length) {
        html += `<div class="card"><h3>Additional Suggestions</h3><ul>`;
        result.additional_suggestions.forEach(s => html += `<li>${s}</li>`);
        html += `</ul></div>`;
      }

      document.getElementById("results").innerHTML = html;
    }
  </script>
</body>
</html>
