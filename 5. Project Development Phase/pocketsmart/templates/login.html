<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sign In - PocketSmart</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="navbar">
    <div class="brand"><a href="/" style="color:white;text-decoration:none;">PocketSmart</a></div>
  </div>

  <div class="container" style="max-width:400px;">
    <div class="card">
      <h2>Welcome Back</h2>
      <form id="loginForm">
        <label>Username</label>
        <input type="text" name="username" required>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn" style="margin-top:20px;width:100%;">Sign In</button>
      </form>
      <div id="errorBox"></div>
      <p style="margin-top:16px;">Don't have an account? <a href="/register">Create Account</a></p>
    </div>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch("/login", { method: "POST", body: formData });
      if (res.redirected) {
        window.location.href = res.url;
      } else {
        const data = await res.json().catch(() => ({ detail: "Login failed" }));
        document.getElementById("errorBox").innerHTML =
          `<div class="error-box">${data.detail || "Login failed"}</div>`;
      }
    });
  </script>
</body>
</html>
